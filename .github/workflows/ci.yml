name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          for target in darwin/amd64 darwin/arm64 linux/386 linux/amd64 linux/arm64 windows/386 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -ldflags "-X main.VERSION=${VERSION}" -o "bin/health-checker_${os}_${arch}${ext}" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - run: cd bin && sha256sum -- * > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes ""
          fi
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          cd bin
          # SHA256SUMS goes last so that a release only lists checksums once every binary is uploaded.
          for file in health-checker_* SHA256SUMS; do
            if grep -qxF "$file" <<< "$existing"; then
              gh release download "$RELEASE_TAG" --pattern "$file" --output "$RUNNER_TEMP/$file" --clobber
              if ! cmp -s "$file" "$RUNNER_TEMP/$file"; then
                echo "::error::Release asset $file differs from this build. Delete it from the release and rerun."
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
